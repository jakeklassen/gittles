[workspace]
members = ["crates/core", "crates/desktop"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gittles-core = { path = "crates/core" }

gpui = "0.2.2"
gpui-component = "0.5"

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
directories = "6"
anyhow = "1"
