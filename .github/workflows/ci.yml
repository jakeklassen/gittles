name: ci

# Mirrors the `mise run test` gate. The cross-platform `check` job exists because
# gpui's backends diverge per OS — Metal, DirectX, Vulkan — and a release is a bad
# place to discover that Windows or macOS stopped compiling.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  RUST_VERSION: '1.94.0'

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: .github/scripts/linux-deps.sh

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  check:
    name: check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}
